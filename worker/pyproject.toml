[project]
name = "vonk-catalog-worker"
version = "0.1.0"
description = "PostgreSQL-leased validation worker for Vonk Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.42",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_catalog_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
