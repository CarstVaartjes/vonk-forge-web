[project]
name = "vonk-catalog-worker"
version = "0.1.0"
description = "PostgreSQL-leased validation worker for Vonk Forge"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpcore2>=2.13.1",
  "httpx2>=2.13.1",
  "jsonschema>=4.26.0",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_catalog_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
