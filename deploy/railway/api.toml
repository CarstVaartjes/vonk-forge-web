[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["/api/**", "/schemas/**", "/pyproject.toml", "/uv.lock", "/Dockerfile.api"]

[deploy]
startCommand = "uvicorn vonk_catalog.runtime:create_app --factory --host 0.0.0.0 --port $PORT --no-access-log --no-proxy-headers"
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 20
drainingSeconds = 20
