[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = ["/worker/**", "/schemas/**", "/pyproject.toml", "/uv.lock", "/Dockerfile.worker"]

[deploy]
startCommand = "python -m vonk_catalog_worker.main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 30
