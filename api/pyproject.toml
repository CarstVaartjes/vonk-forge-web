[project]
name = "vonk-catalog-api"
version = "0.1.0"
description = "Public recipe catalog API for Vonk Forge"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.20.0",
  "cryptography>=50.0.1",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "jsonschema>=4.26.0",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.15.0",
  "sqlalchemy>=2.1.1",
  "uvicorn>=0.54.0",
  "vonk-forge-public-contracts",
]

[tool.uv.sources]
# The canonical public contracts live in the recipe repository, never in a
# hand-maintained copy here. Resolve them from the recipe repository's moving
# main branch, mirroring the platform control declaration; uv.lock records the
# exact commit consumed by a lock/build update.
vonk-forge-public-contracts = { git = "https://github.com/CarstVaartjes/vonk-forge-recipes.git", branch = "main", subdirectory = "contracts" }

[project.scripts]
vonk-catalog-admin = "vonk_catalog.admin:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
