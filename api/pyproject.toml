[project]
name = "vonk-catalog-api"
version = "0.1.0"
description = "Public recipe catalog API for Vonk Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "cryptography==46.0.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt==2.10.1",
  "sqlalchemy==2.0.42",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
