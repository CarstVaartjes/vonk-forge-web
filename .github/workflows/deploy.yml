name: Package and deploy

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Deploy the verified commit to the protected production environment
        required: true
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
          - name: web
            dockerfile: Dockerfile.web
          - name: backup
            dockerfile: Dockerfile.backup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vonk-forge-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: false
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  staging:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy migration and application services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          CLI_IMAGE: ghcr.io/railwayapp/cli@sha256:f50dad4fcbb0653e5f8423e799f527d227012cccda46a122ac24d5bbdeeb3793
        run: |
          for service in migration api worker web backup restore; do
            docker run --rm -e RAILWAY_TOKEN -v "$PWD:/workspace" -w /workspace "$CLI_IMAGE" \
              up --ci --project "$RAILWAY_PROJECT_ID" --environment staging --service "$service" \
              --message "${GITHUB_SHA}"
          done
      - name: Anonymous staging smoke
        env:
          VONK_STAGING_BASE_URL: ${{ vars.VONK_STAGING_BASE_URL }}
        run: scripts/staging-smoke

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_production
    needs: staging
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy migration and application services after protected approval
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          CLI_IMAGE: ghcr.io/railwayapp/cli@sha256:f50dad4fcbb0653e5f8423e799f527d227012cccda46a122ac24d5bbdeeb3793
        run: |
          for service in migration api worker web backup restore; do
            docker run --rm -e RAILWAY_TOKEN -v "$PWD:/workspace" -w /workspace "$CLI_IMAGE" \
              up --ci --project "$RAILWAY_PROJECT_ID" --environment production --service "$service" \
              --message "${GITHUB_SHA}"
          done
      - name: Production read-only smoke
        env:
          VONK_STAGING_BASE_URL: https://vonkforge.ai
        run: scripts/staging-smoke
