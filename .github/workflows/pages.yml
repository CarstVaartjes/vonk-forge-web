name: Deploy frontend to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: vonk-forge-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Build frontend
        env:
          VITE_CATALOG_API_URL: ${{ vars.VITE_CATALOG_API_URL }}
        run: npm --prefix web run build
      - name: Check Cloudflare Pages configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "CLOUDFLARE_PAGES_PROJECT is missing from the production environment" >&2; exit 1; }
      - name: Publish production Pages deployment
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
