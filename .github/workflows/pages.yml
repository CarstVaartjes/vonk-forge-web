name: Deploy frontend to Cloudflare Pages

# One workflow per main commit: CI runs first (ci.yml) and the deploy needs it.
# Scheduled runs skip CI: the code has not changed since the last main push
# that passed it, and the deploy job re-verifies the recipe release itself.
# Manual dispatches run CI, so a hand-started deploy is also gated.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Picks up new signed recipe-library releases. vonk-forge-recipes has no
  # token that could dispatch this workflow, so the site polls instead.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: vonk-forge-pages-production
  cancel-in-progress: false

jobs:
  # Called workflow: its security job uploads SARIF, so the caller must grant
  # security-events: write or every run fails at startup.
  ci:
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    # Fan-in: deploy after CI passed, or when CI was skipped (schedule).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      # Downloads recipe-library.tar from the newest signed recipe-library
      # release for the supported contract major (or the tag in the
      # optional VONK_RECIPE_RELEASE variable), verifies SHA256SUMS against its
      # Sigstore attestation from publish.yml and every member against
      # SHA256SUMS, and writes web/public/catalog. Any failure stops the job, so
      # the previous deployment stays live.
      - name: Fetch and verify the recipe library release
        env:
          GH_TOKEN: ${{ github.token }}
          VONK_RECIPE_RELEASE: ${{ vars.VONK_RECIPE_RELEASE }}
        run: node web/scripts/recipe-release.mjs
      - name: Build frontend
        run: |
          set -euo pipefail
          npm --prefix web run build
          test -s web/dist/catalog/catalog-index.json
          test -s web/dist/catalog/release.json
      - name: Skip a scheduled run when the deployed release is current
        id: current
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          deployed="$(curl -fsSL "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/catalog/release.json" || true)"
          if [ "$deployed" = "$(cat web/dist/catalog/release.json)" ]; then
            echo "Deployed site already serves $(jq -r .tag web/dist/catalog/release.json)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Cloudflare Pages configuration
        if: steps.current.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "CLOUDFLARE_PAGES_PROJECT is missing from the production environment" >&2; exit 1; }
      - name: Publish production Pages deployment
        if: steps.current.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
