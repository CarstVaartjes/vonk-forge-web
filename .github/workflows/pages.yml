name: Deploy frontend to Cloudflare Pages

# One workflow per main commit: CI runs first (ci.yml) and the build needs it.
# Scheduled and dispatched runs skip CI: the code has not changed since the last
# main push that passed it, and a release dispatch must not be blocked by checks that
# scan unrelated branches (gitleaks reads every ref). Every run, whatever started it,
# tests the library it is about to publish: the build job downloads and verifies the
# release, runs tsc and the unit tests against it and builds; the e2e job runs the
# acceptance spec (every page, axe, console errors, transfer budget) against that
# built dist and library; only then does the deploy job publish the same dist.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Backstop for new signed recipe-library releases. The recipes publish job
  # dispatches this workflow (workflow_dispatch) as soon as it publishes; the
  # hourly poll only covers a dispatch that failed.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: vonk-forge-pages-production
  cancel-in-progress: false

jobs:
  # Called workflow: its security job uploads SARIF, so the caller must grant
  # security-events: write or every run fails at startup.
  ci:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    # Fan-in: build after CI passed, or when CI was skipped (schedule and dispatch).
    # Only from main: the production environment has no branch policy, so a dispatch
    # from another ref must not publish its code.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.current.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      # Downloads the newest signed recipe-library release, whatever its contract
      # major (or the tag in the optional VONK_RECIPE_RELEASE variable), verifies SHA256SUMS against its
      # Sigstore attestation from publish.yml and every file against
      # SHA256SUMS, and writes web/public/catalog. Any failure stops the job, so
      # the previous deployment stays live.
      - name: Fetch and verify the recipe library release
        env:
          GH_TOKEN: ${{ github.token }}
          VONK_RECIPE_RELEASE: ${{ vars.VONK_RECIPE_RELEASE }}
        run: node web/scripts/recipe-release.mjs
      # A scheduled run stops here when the site already serves this release.
      # CLOUDFLARE_PAGES_PROJECT is a repository variable: this job has no environment.
      - name: Skip a scheduled run when the deployed release is current
        id: current
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          deployed="$(curl -fsSL "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/catalog/release.json" || true)"
          if [ "$deployed" = "$(cat web/public/catalog/release.json)" ]; then
            echo "Deployed site already serves $(jq -r .tag web/public/catalog/release.json)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Compile against the schema that release ships (see ci.yml).
      - name: Generate the catalog types from the release schema
        if: steps.current.outputs.skip != 'true'
        run: npm --prefix web run catalog:types
      - name: Unit tests
        if: steps.current.outputs.skip != 'true'
        run: npm --prefix web test -- --run
      - name: Build frontend
        if: steps.current.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm --prefix web run build
          test -s web/dist/catalog/catalog-index.json
          test -s web/dist/catalog/release.json
      - name: Keep the built site for the e2e and deploy jobs
        if: steps.current.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # The acceptance spec against the downloaded library (no fixture) and the exact dist that
  # deploy publishes. The image tag must match @playwright/test (ci-playwright-image.test.mjs).
  e2e:
    needs: [build]
    # An explicit status function: ci is skipped on schedule and dispatch, and the implicit
    # success() would skip these jobs with it.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.skip != 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    env:
      VONK_E2E_DOWNLOADED_LIBRARY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-web-dist
          path: web/dist
      - run: npm --prefix web run test:e2e -- acceptance

  deploy:
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result == 'success' }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-web-dist
          path: web/dist
      - name: Check Cloudflare Pages configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from the production environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "CLOUDFLARE_PAGES_PROJECT is missing from the repository variables" >&2; exit 1; }
      - name: Publish production Pages deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
