name: CI

# Pull requests run this directly. A push to main runs it through pages.yml
# (workflow_call), which deploys only after it passes. A Dependabot pull
# request runs no job: its update lands through an integration pull request,
# which runs CI once (web/scripts/ci-dependabot.test.mjs).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. A main run (called from
# pages.yml) is never cancelled: it gates a deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Tests never use git: reject added test lines that spawn it. The diff is
      # the one git call, made here at the edge. The checkout is depth 1, so
      # fetch the base first. Pull requests only; a push to main has no base.
      - name: Reject git in new test lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff -U0 "$BASE_SHA" | node web/scripts/check-test-git.mjs
      # Every registered single-source value has one owner in the tracked files.
      # The file list is the input, so the check itself runs no git.
      - name: Check single-source values
        shell: bash
        run: git ls-files -z | node web/scripts/check-single-sources.mjs
      - run: npm --prefix web audit --audit-level=high
      # The same fetch-and-verify step the Pages deployment runs, against the
      # real current signed recipe-library release.
      - name: Verify the current recipe library release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/recipe-release.mjs
      # Compile the site against the schema that release ships: `tsc` (the build
      # below) fails when the shipped adapter reads a field it does not have; the
      # typecheck step below does the same for tests and fixtures.
      - name: Generate the catalog types from the release schema
        run: npm --prefix web run catalog:types
      # Tests and fixtures are type-checked on pull requests only. pages.yml runs this
      # workflow on push too, and an additive recipe release must never
      # block a deploy; the deploy build checks only shipped code.
      - name: Type-check tests and fixtures
        if: github.event_name == 'pull_request'
        run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # The browser suite serves the dist built above (playwright.config.ts does not rebuild it
  # in CI). Microsoft's image bakes in the browsers and system libraries, so there is no
  # install step; its tag must match the @playwright/test version
  # (web/scripts/ci-playwright-image.test.mjs).
  e2e:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-web-dist
          path: web/dist
      - run: npm --prefix web run test:e2e

  security:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
