name: CI

# Pull requests run this directly. A push to main runs it through pages.yml
# (workflow_call), which deploys only after it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=high
      # The same fetch-and-verify step the Pages deployment runs, against the
      # real current signed recipe-library release.
      - name: Verify the current recipe library release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/recipe-release.mjs
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      # Playwright rebuilds and serves the production bundle with `vite preview`.
      - run: npm --prefix web run test:e2e

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
