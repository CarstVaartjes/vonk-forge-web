name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_DB: vonk_catalog_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: vonk
        options: >-
          --health-cmd "pg_isready -U vonk -d vonk_catalog_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.14"
      - run: uv sync --all-packages --locked
      - run: uv run --project api pytest api/tests deploy/tests -q
        env:
          VONK_TEST_DATABASE_URL: postgresql+psycopg://vonk:test-only@127.0.0.1:5432/vonk_catalog_test
      - run: uv run --project worker pytest worker/tests -q

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=high
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.14"
      - run: uv sync --project api --locked
      - run: npm --prefix web ci
      - run: scripts/verify-contracts
      - run: scripts/export-contract

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - run: VONK_POSTGRES_PASSWORD_FILE="$PWD/deploy/secrets/postgres-password.txt.example" docker compose -f deploy/compose.yaml config --quiet
      - run: docker build -f Dockerfile.api -t vonk-catalog-api:test .
      - run: docker build -f Dockerfile.worker -t vonk-catalog-worker:test .
      - run: docker build -f Dockerfile.web -t vonk-catalog-web:test .
      - run: docker build -f Dockerfile.backup -t vonk-catalog-backup:test .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.14"
      - run: uv sync --project api --locked
      - run: VONK_TEST_CONTAINER_IMAGES=1 uv run --project api pytest deploy/tests -q

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
        if: always()
        with:
          sarif_file: trivy-results.sarif
