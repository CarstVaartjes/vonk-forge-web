version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  # typescript 5 + openapi-typescript for the generator scripts; typescript stays
  # on 5.x here (openapi-typescript peers ^5), unlike the typescript 7 in /web.
  - package-ecosystem: npm
    directory: /web/tools/ts-api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
